[package]
name = "icu-liaison-kairos-consumer"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

# Only the accepted Kairos staged-resource runtime and types are consumed.
# Match the same immutable revision; no internal scheduler or queueing library.
[dependencies]
kairo-ecs-des = { git = "https://github.com/edithatogo/kairos", rev = "273bf44956dfadd31336a9f9f645eba6b39779f9" }
kairo-ecs-types = { git = "https://github.com/edithatogo/kairos", rev = "273bf44956dfadd31336a9f9f645eba6b39779f9" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
