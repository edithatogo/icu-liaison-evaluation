[build-system]
requires = ["setuptools>=84.1,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "icu-liaison-evaluation-portable"
version = "0.1.0"
description = "Portable ANZICS-guided illustrative ICU liaison economic modelling consumer"
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
license = "Apache-2.0"
dependencies = [
  "numpy>=2.3,<3",
  "scipy>=1.17,<2",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "jsonschema>=4.26,<5"]
# Optional provider for the separate P1 qualification environment.
voiage = ["voiage==3.1.0"]
report = ["matplotlib>=3.10,<4"]
# Optional scheduler, installed in its own locked environment (see README).
workflow = ["snakemake==9.27.2"]
check = ["mypy==2.4.1", "scipy-stubs==1.18.1.1", "types-jsonschema==4.26.0.20261006", "types-PyYAML==6.0.12.20261122"]

[project.scripts]
icu-liaison-evaluate = "icu_liaison.cli:main"
icu-liaison-protocol = "icu_liaison.protocol_cli:main"
icu-liaison-sources = "icu_liaison.p3_cli:main"
icu-liaison-p4 = "icu_liaison.p4_cli:main"
icu-liaison-p5 = "icu_liaison.p5_cli:main"
icu-liaison-p5-review = "icu_liaison.p5_review_cli:main"
icu-liaison-p6 = "icu_liaison.p6_cli:main"
icu-liaison-p6-native = "icu_liaison.p6_native_cli:main"
icu-liaison-placeholders = "icu_liaison.placeholders_cli:main"
icu-liaison-p8 = "icu_liaison.p8_cli:main"
icu-liaison-p8-compose = "icu_liaison.p8_composition_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
strict = true

[tool.mypy]
python_version = "3.15"
strict = true
explicit_package_bases = true
mypy_path = ["src", "."]
files = ["src", "tools", "tests"]
cache_dir = "private/mypy-cache"
enable_error_code = ["ignore-without-code"]
