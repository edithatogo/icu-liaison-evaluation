repos:
  - repo: local
    hooks:
      - id: icu-liaison-local-ci
        name: Check staged source, types and fictional tests
        entry: .venv/bin/python tools/run_local_ci.py --mode pre-commit --check-staged --gitleaks
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: icu-liaison-merge-ci
        name: Full validation of the merge result
        entry: .venv/bin/python tools/run_local_ci.py --mode full --check-staged --gitleaks
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit]
      - id: icu-liaison-local-ci-full
        name: Validate the outgoing source and fictional workflow
        entry: .venv/bin/python tools/run_local_ci.py --mode full
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: quality-shellcheck
        name: ShellCheck
        entry: shellcheck -e SC1091
        language: system
        types: [shell]
      - id: quality-eof
        name: End-of-file formatting
        entry: private/venv-quality/bin/python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
      - id: quality-whitespace
        name: Trailing whitespace
        entry: private/venv-quality/bin/python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
