repos:
  - repo: local
    hooks:
      - id: icu-liaison-local-ci
        name: ICU liaison local pre-commit CI (manifest, pytest, smoke, forbidden paths)
        entry: .venv/bin/python tools/run_local_ci.py --mode pre-commit --check-staged --gitleaks
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: icu-liaison-local-ci-full
        name: ICU liaison full local CI (manifest, pytest, smoke, portable oracles, CLI)
        entry: .venv/bin/python tools/run_local_ci.py --mode full
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
