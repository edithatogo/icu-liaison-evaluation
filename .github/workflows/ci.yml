name: Synthetic source validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Audit runner egress
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out project and recorded dependency pins
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - name: Set up the pinned CPython
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Create and verify the repository environment
        run: |
          python -m venv .venv
          version="$(.venv/bin/python --version)"
          echo "$version"
          test "$version" = "Python $(cat .python-version)"
      - name: Install pinned source, test and report dependencies
        run: .venv/bin/python -m pip install -c requirements-ci.txt --build-constraint requirements-ci.txt '.[test,report]'
      - name: Verify project hashes and Conductor gitlink
        run: .venv/bin/python tools/verify_source_manifest.py
      - name: Validate source-only table and figure catalogue
        run: .venv/bin/python tools/validate_reporting_contracts.py
      - name: Assert clinical safety overrides synthetic economic gain
        run: .venv/bin/python tools/evaluate_safety_decision.py --synthetic-net-resource-benefit 1000000
      - name: Reject stale or unverified source admission
        run: .venv/bin/python tools/evidence_lifecycle.py --as-of 2026-11-19 --price-year 2026
      - name: Falsify synthetic economic and safety assumptions
        run: .venv/bin/python -m tools.p10_falsification --iterations 128
      - name: Verify causal pre-registration and exposure remain draft
        run: .venv/bin/python tools/validate_preregistration.py
      - name: Run synthetic contract and numerical tests
        run: .venv/bin/python -m pytest -q
      - name: Exercise synthetic reports and closed admission gates
        run: .venv/bin/python tools/ci_smoke.py
      - name: Set up repository-local quality tools
        env:
          PYTHONPATH: ""
        run: |
          .venv/bin/python -m venv private/venv-quality
          test "$(private/venv-quality/bin/python --version)" = "Python $(cat .python-version)"
          private/venv-quality/bin/python -m pip install -r requirements-quality.txt --build-constraint requirements-p11-build.txt
          private/venv-quality/bin/python -m pip check
      - name: Run shell and text quality checks
        env:
          PYTHONPATH: ""
        run: |
          private/venv-quality/bin/python -m pre_commit run quality-shellcheck --all-files
          private/venv-quality/bin/python -m pre_commit run quality-eof --all-files
          private/venv-quality/bin/python -m pre_commit run quality-whitespace --all-files
      - name: Create isolated Snakemake environment
        run: |
          python -m venv private/venv-p11
          test "$(private/venv-p11/bin/python --version)" = "Python $(cat .python-version)"
          private/venv-p11/bin/python -m pip install -r requirements-p11.txt -c requirements-p11.txt --build-constraint requirements-p11-build.txt '.[test,report,workflow]'
          private/venv-p11/bin/python -m pip check
      - name: Exercise Snakemake reruns and interrupted-run recovery
        run: private/venv-p11/bin/python -m pytest -q tests/test_p11_workflow.py
