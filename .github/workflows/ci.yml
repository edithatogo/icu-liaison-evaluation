name: Synthetic source validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Check out project and recorded dependency pins
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install base, test and report dependencies
        run: python -m pip install -c requirements-ci.txt '.[test,report]'
      - name: Verify project hashes and Conductor gitlink
        run: python tools/verify_source_manifest.py
      - name: Run synthetic contract and numerical tests
        run: python -m pytest -q
      - name: Exercise synthetic reports and closed admission gates
        run: python tools/ci_smoke.py
